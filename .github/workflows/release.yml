name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  quality:
    name: Test and verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository and frontend
        run: |
          npm run verify:repo
          npm run build
          bash -n runtime/install-simplseq.sh
          ! grep -Eq 'api\.github\.com|install_github|create_github_token|gitcreds_set' runtime/install-simplseq.sh

      - name: Verify release tag matches app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$APP_VERSION" || {
            echo "Release tag $RELEASE_TAG does not match package version v$APP_VERSION"
            exit 1
          }

  build:
    name: Build ${{ matrix.platform }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify macOS runtime architecture contract
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bash -n runtime/install-simplseq.sh
          grep -q 'softwareupdate --install-rosetta --agree-to-license' runtime/install-simplseq.sh
          test "${{ matrix.target }}" = "aarch64-apple-darwin"
          test "$(uname -m)" = "arm64"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: malaria-amplicon-nf ${{ github.ref_name }}
          releaseBody: |
            malaria-amplicon-nf ${{ github.ref_name }} release.

            Download the installer for Windows or Apple Silicon macOS.

            macOS: this open-source build is ad-hoc signed rather than Apple-notarized.
            On first launch, approve it under System Settings > Privacy & Security > Open Anyway.
          releaseDraft: false
          prerelease: false

      - name: Verify macOS ad-hoc bundle signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle/macos/malaria-amplicon-nf.app"
          test -d "$APP_BUNDLE"
          test -d "$APP_BUNDLE/Contents/_CodeSignature"
          codesign --verify --deep --strict --verbose=4 "$APP_BUNDLE"
          SIGNATURE_DETAILS="$(codesign -dv --verbose=4 "$APP_BUNDLE" 2>&1)"
          grep -q "Signature=adhoc" <<<"$SIGNATURE_DETAILS"

  simplify-release-assets:
    name: Simplify release assets
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Keep only user-facing installers
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace("refs/tags/", "");
            const version = tag.replace(/^v/, "");
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });

            const windowsName = `malaria-amplicon-nf-${version}-Setup.exe`;
            const macName = `malaria-amplicon-nf-${version}-arm64.dmg`;
            const friendlyNames = new Set([
              windowsName,
              macName,
            ]);

            function friendlyNameFor(name) {
              if (friendlyNames.has(name)) return name;
              if (/^malaria-amplicon-nf_.*_x64-setup\.exe$/i.test(name)) return windowsName;
              if (/^malaria-amplicon-nf_.*_aarch64\.dmg$/i.test(name)) return macName;
              return null;
            }

            const deletePatterns = [
              /\.msi$/i,
              /\.deb$/i,
              /\.rpm$/i,
              /\.app\.tar\.gz$/i,
            ];

            for (const asset of release.assets) {
              const newName = friendlyNameFor(asset.name);
              if (newName) {
                if (asset.name !== newName) {
                  await github.rest.repos.updateReleaseAsset({
                    owner,
                    repo,
                    asset_id: asset.id,
                    name: newName,
                    label: newName,
                  });
                }
                continue;
              }

              if (deletePatterns.some((pattern) => pattern.test(asset.name))) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
            }

  verify-release-assets:
    name: Verify public release downloads
    needs: simplify-release-assets
    runs-on: ubuntu-22.04
    steps:
      - name: Download and validate every public asset
        shell: bash
        env:
          RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          assets=(
            "malaria-amplicon-nf-${VERSION}-Setup.exe"
            "malaria-amplicon-nf-${VERSION}-arm64.dmg"
          )
          for asset in "${assets[@]}"; do
            curl -fsSL --retry 5 --retry-all-errors "${RELEASE_BASE}/${asset}" -o "${asset}"
            test -s "${asset}"
          done
