[package]
name = "malaria_amplicon_nf_desktop"
version = "1.0.3"
description = "Desktop launcher for the malaria-amplicon-nf Nextflow app."
authors = ["malaria-amplicon-nf"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "malaria_amplicon_nf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Graphics_Dwm"] }
